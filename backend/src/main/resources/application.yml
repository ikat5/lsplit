spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      # Neon free tier auto-suspends the compute when idle. The first connection
      # after a cold start can be dropped by the pooler while the compute wakes up,
      # so let Hikari retry acquiring the initial connection instead of failing boot.
      initialization-fail-timeout: 60000
      connection-timeout: 30000
      keepalive-time: 30000
      max-lifetime: 300000
      idle-timeout: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  # CORS origins are NOT configured here: CorsConfig's @Value default
  # (https://*.vercel.app + http://localhost:5173) applies standalone,
  # independent of any environment variable.

server:
  port: ${PORT:8080}
